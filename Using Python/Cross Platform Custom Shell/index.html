<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Platform Web Shell</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .terminal {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background-color: #1a1a1a;
            color: #f0f0f0;
        }
        .command-output {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .prompt::before {
            content: '$';
            color: #4CAF50;
            margin-right: 8px;
        }
        .history-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Cross-Platform Web Shell</h1>
            <p class="text-gray-600">Current OS: <span class="font-mono">{{ os_type }}</span></p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Main Terminal Area -->
            <div class="lg:col-span-3">
                <div class="terminal rounded-lg p-4 h-96 overflow-y-auto mb-4" id="output">
                    <div class="welcome-message mb-4">
                        Welcome to the Cross-Platform Web Shell!
                        Type 'help' for a list of available commands.
                    </div>
                </div>
                
                <div class="flex">
                    <div class="terminal flex-grow rounded-lg overflow-hidden">
                        <div class="flex items-center p-2">
                            <span class="prompt"></span>
                            <input type="text" id="commandInput"
                                   class="bg-transparent border-none outline-none flex-grow text-white"
                                   placeholder="Enter command...">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Command History Sidebar -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-md p-4">
                    <h2 class="text-xl font-semibold mb-4">Command History</h2>
                    <div id="history" class="space-y-2"></div>
                    <button onclick="clearHistory()" 
                            class="mt-4 bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 w-full">
                        Clear History
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const commandInput = document.getElementById('commandInput');
        const output = document.getElementById('output');
        const history = document.getElementById('history');
        let commandHistory = [];
        let historyIndex = -1;

        commandInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const command = commandInput.value.trim();
                if (command) {
                    await executeCommand(command);
                    commandInput.value = '';
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    commandInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex > -1) {
                    historyIndex--;
                    commandInput.value = historyIndex >= 0 ? commandHistory[historyIndex] : '';
                }
            }
        });

        async function executeCommand(command) {
            try {
                // Add command to output
                appendToOutput(`$ ${command}`, 'command');
                
                // Execute command
                const response = await fetch('/api/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    appendToOutput(data.output, 'output');
                    commandHistory.unshift(command);
                    historyIndex = -1;
                    updateHistoryDisplay();
                } else {
                    appendToOutput(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                appendToOutput(`Error: ${error.message}`, 'error');
            }
        }

        function appendToOutput(text, type) {
            const div = document.createElement('div');
            div.className = `command-output ${type} mb-2`;
            div.textContent = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function updateHistoryDisplay() {
            history.innerHTML = commandHistory
                .map(cmd => `
                    <div class="history-item p-2 rounded cursor-pointer text-sm" 
                         onclick="commandInput.value='${cmd.replace(/'/g, "\\'")}';commandInput.focus()">
                        ${cmd}
                    </div>
                `)
                .join('');
        }

        async function clearHistory() {
            try {
                await fetch('/api/clear-history', { method: 'POST' });
                commandHistory = [];
                historyIndex = -1;
                updateHistoryDisplay();
            } catch (error) {
                console.error('Failed to clear history:', error);
            }
        }

        // Initial history load
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                commandHistory = data.map(item => item.command);
                updateHistoryDisplay();
            });
    </script>
</body>
</html>
